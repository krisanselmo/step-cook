services:
  step-cook:
    container_name: step-cook
    # ARM64 for Raspberry Pi; QEMU kicks in automatically when building on x86.

    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_TELEMETRY_DISABLED: 1

    image: krisanselmo/step-cook:latest
    restart: unless-stopped

    ports:
      - '3211:3000'

    # Prefer a .env file over inlining these.
    env_file:
      - .env.local

    environment:
      - NODE_ENV=production
      # - GEMINI_MODEL_NAME=gemini-2.5-flash

    # Sized for a Pi 3 with 1 GB of RAM.
    deploy:
      resources:
        limits:
          memory: 800M
