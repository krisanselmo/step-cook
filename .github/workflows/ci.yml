name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The bump is a step here rather than its own job: a skipped status
  # propagates along `needs`, and a version job skipped outside PRs dragged
  # `docker` down with it.
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR, the branch itself: the bump is pushed to it and the tree
          # actually merged is the one verified. Full history feeds the version.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Compute next version
        if: github.event_name == 'pull_request'
        id: next
        run: .github/scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        if: github.event_name == 'pull_request' && steps.next.outputs.bump_needed == 'true'
        run: |
          npm version "${{ steps.next.outputs.version }}" --no-git-tag-version
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): ${{ steps.next.outputs.version }}"
          git push origin HEAD:${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Multi-arch image (amd64 + arm64) on Docker Hub, same tags as build.sh
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published version
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::v${{ steps.version.outputs.version }} est déjà publiée. Incrémentez la version avant de merger."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `sha-` is immutable: should a version tag ever be rewritten, the image
      # stays reachable by its commit.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            krisanselmo/step-cook:latest
            krisanselmo/step-cook:${{ steps.version.outputs.version }}
            krisanselmo/step-cook:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
